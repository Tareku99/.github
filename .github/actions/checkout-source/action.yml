name: Checkout application source
description: Validate and check out the tested source commit, including manually selected beta branches.
inputs:
  branch:
    description: Legacy source branch override for a beta run dispatched from the default branch. Leave empty to use the triggering commit.
    required: false
    default: ""
  default-branch:
    description: Repository default branch required when using the legacy branch override.
    required: true
outputs:
  source-sha:
    description: Exact application commit checked out by this action.
    value: ${{ steps.source.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Resolve source ref
      id: ref
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
        EVENT_SHA: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        BETA_BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "workflow_dispatch" && "$EVENT_REF" != refs/heads/* ]]; then
          echo "::error::Select a branch for a beta release."
          exit 1
        fi
        if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$BETA_BRANCH" ]]; then
          if [[ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::The legacy beta branch override is only available from the default branch."
            exit 1
          fi
          git check-ref-format "refs/heads/$BETA_BRANCH"
          printf 'ref=refs/heads/%s\n' "$BETA_BRANCH" >> "$GITHUB_OUTPUT"
        else
          printf 'ref=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
        fi

    - name: Check out application source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.ref.outputs.ref }}
        persist-credentials: false

    - name: Record source commit
      id: source
      shell: bash
      run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
