name: Validate shared components

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL             https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz             -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Validate composite action manifest
        run: ruby -e 'require "yaml"; abort unless ARGV.all? { |path| YAML.load_file(path).is_a?(Hash) }' .github/actions/docker-release/action.yml .github/actions/ci-summary/action.yml

      - name: Validate reporting script
        run: python3 -m py_compile .github/actions/ci-summary/summary.py

      - name: Test GHCR publisher
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/actions/docker-release/publish.sh
          bash -n tests/test_publish.sh
          bash tests/test_publish.sh
